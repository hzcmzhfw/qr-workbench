<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二维码工作台</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><small>趁手 × 轻办</small><h1>二维码工作台</h1></div><button id="expand" class="quiet">打开工作台 ↗</button></header><nav aria-label="功能"><button id="generate-tab" class="selected" aria-pressed="true">生成二维码</button><button id="scan-tab" aria-pressed="false">识别图片 / ZIP</button></nav><section id="generate"><label for="content">网址或文字</label><textarea id="content" placeholder="输入网址或文字，打开插件时自动填入当前网址" maxlength="100000"></textarea><div class="options"><label>尺寸<select id="size"><option>128</option><option>192</option><option selected>320</option><option>512</option><option>768</option><option>1024</option></select></label><label>容错等级<select id="level"><option value="L">L · 7%</option><option value="M" selected>M · 15%</option><option value="Q">Q · 25%</option><option value="H">H · 30%</option></select></label><button id="current" class="quiet">当前网址</button></div><p id="capacity" class="hint"></p><div id="preview" aria-label="二维码预览"></div><p id="part-info" class="hint"></p><div class="actions"><button id="download" class="primary" disabled>下载 PNG</button><button id="copy-content">复制内容</button></div></section><section id="scan" hidden><label class="drop" id="drop" for="file"><strong>选择或拖入图片 / ZIP</strong><span>支持 ZIP 批量识别、粘贴图片 · 本地处理</span><input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,.zip,application/zip"></label><img id="scan-preview" alt="待识别图片" hidden><label for="result">识别结果</label><textarea id="result" readonly placeholder="识别成功后显示网址或文字"></textarea><div class="actions"><button id="copy-result">复制结果</button><a id="open-result" class="button" hidden target="_blank" rel="noopener noreferrer">打开链接 ↗</a></div><p class="hint">每张图片识别一个二维码；ZIP 支持子目录图片，完整的一组趁手分片自动还原。</p><div id="batch-results" aria-label="逐张识别结果"></div></section><p id="status" role="status" aria-live="polite"></p><footer><a href="https://tools.hzcmzhfw.cn/qrcode/?utm_source=qr_workbench&amp;utm_medium=extension" target="_blank" rel="noopener noreferrer">趁手 · 网页生成 ↗</a><a href="https://qingban.hzcmzhfw.cn/tools/qr-scan/?utm_source=qr_workbench&amp;utm_medium=extension" target="_blank" rel="noopener noreferrer">轻办 · 图片识别 ↗</a></footer></main><script src="app.js"></script></body></html>
